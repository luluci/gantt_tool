  function calcTreeSticky() {
    return;

    // ツール全体コンテナの高さを取得
    const inputPaneTool = leftPane.querySelector(".inputPaneToolHeader");
    const inpPaneHeaderH = inputPaneTool ? inputPaneTool.getBoundingClientRect().height : 0;
    // domain要素
    const domains = leftPane.querySelectorAll(".inputPaneDomain");
    domains.forEach((dom) => {
      const domHeader = dom.querySelector(".inputPaneDomainHeader");
      domHeader.style.top = inpPaneHeaderH + "px";
      const offsetProject = inpPaneHeaderH + domHeader.getBoundingClientRect().height;

      // project要素
      const projects = dom.querySelectorAll(".inputPaneProject");
      projects.forEach((pr) => {
        const prHeader = pr.querySelector(".inputPaneProjectHeader");
        const offsetVersion = offsetProject + prHeader.getBoundingClientRect().height;
        prHeader.style.top = offsetProject + "px";

        // version要素
        const versions = pr.querySelectorAll(".inputPaneVersion");
        versions.forEach((vr) => {
          const vrHeader = vr.querySelector(".inputPaneVersionHeader");
          const offsetTask = offsetVersion + vrHeader.getBoundingClientRect().height;
          vrHeader.style.top = offsetVersion + "px";

          // task要素
          const tasks = vr.querySelectorAll(".inputPaneTask");
          tasks.forEach((tk) => {
            const tkHeader = tk.querySelector(".inputPaneTaskHeader");
            tkHeader.style.top = offsetTask + "px";
          });
        });
      });
    });
  }

  function validateCaseOwner(task, plan) {
    const key = (plan.caseId || "") + "|" + (plan.ownerId || "");
    return !(task.plans || []).some((p) => p.id !== plan.id && (p.caseId || "") + "|" + (p.ownerId || "") === key);
  }

  function applyColorToCaseOwner(task, plan, color) {
    const key = (plan.caseId || "") + "|" + (plan.ownerId || "");
    (task.plans || []).forEach((p) => {
      if ((p.caseId || "") + "|" + (p.ownerId || "") === key) p.color = color;
    });
  }

  function planMatchesCaseFilter(pl) {
    if (!state.caseFilter || state.caseFilter.length === 0) return true;
    return state.caseFilter.includes(pl.caseId || "");
  }

  function caseMatchesCaseFilter(cs) {
    if (!state.caseFilter || state.caseFilter.length === 0) return true;
    return state.caseFilter.includes(cs.id || "");
  }

  function contiguousBlock(plan, dateStr, state, datesOverride, cellKind) {
    const dates = datesOverride || getDateRange(state);
    const idx = dates.indexOf(dateStr);
    if (idx < 0) return { start: dateStr, end: dateStr };
    let s = idx, e = idx;
    let li = s - 1;
    while (li >= 0) {
      if (cellIsOn(plan, dates[li], cellKind)) {
        s = li;
        li--;
        continue;
      }
      if (isHolidayDate(dates[li], plan, state)) {
        li--;
        continue;
      }
      break;
    }
    let ri = e + 1;
    while (ri < dates.length) {
      if (cellIsOn(plan, dates[ri], cellKind)) {
        e = ri;
        ri++;
        continue;
      }
      if (isHolidayDate(dates[ri], plan, state)) {
        ri++;
        continue;
      }
      break;
    }
    return { start: dates[s], end: dates[e], startIdx: s, endIdx: e };
  }

  const MOUSE_EV_MODE_CLICK = 1;
  const MOUSE_EV_MODE_MOVE = 2;
  const MOUSE_EV_MODE_RESIZE_LEFT = 3;
  const MOUSE_EV_MODE_RESIZE_RIGHT = 4;

  function planCellInteractionMode(pl, dateStr, localX, cellWidth, datesOverride, cellKind) {
    const blk = contiguousBlock(pl, dateStr, state, datesOverride, cellKind);
    if (!cellIsOn(pl, dateStr, cellKind)) return MOUSE_EV_MODE_CLICK;
    if (dateStr === blk.start && localX < PLAN_CELL_EDGE_PX) return MOUSE_EV_MODE_RESIZE_LEFT;
    if (dateStr === blk.end && localX > cellWidth - PLAN_CELL_EDGE_PX) return MOUSE_EV_MODE_RESIZE_RIGHT;
    return MOUSE_EV_MODE_MOVE;
  }

  function cursorForPlanCellMode(mode) {
    if (mode === MOUSE_EV_MODE_RESIZE_LEFT || mode === MOUSE_EV_MODE_RESIZE_RIGHT) return "ew-resize";
    if (mode === MOUSE_EV_MODE_MOVE) return "move";
    return "";
  }

  function clearInputCell(cells, ds) {
    const c = cells[ds];
    if (!c || typeof c !== "object" || c === true) {
      delete cells[ds];
      return;
    }
    delete c.util;
    if (!c.comment || !String(c.comment.text || "").trim()) {
      delete cells[ds];
      return;
    }
    cells[ds] = c;
  }

  function shiftIndexByBusinessDays(dates, startIdx, step, plan, state) {
    if (step === 0) return startIdx;
    let idx = startIdx;
    let remain = Math.abs(step);
    const dir = step > 0 ? 1 : -1;
    while (remain > 0) {
      idx += dir;
      if (idx < 0 || idx >= dates.length) return -1;
      if (!isHolidayDate(dates[idx], plan, state)) remain--;
    }
    return idx;
  }

  const WD_JP = ["日", "月", "火", "水", "木", "金", "土"];

  function weekdayJp(ymd) {
    const d = parseYMD(ymd);
    return d ? WD_JP[d.getDay()] : "";
  }

  function computeTreeHead2WidthPx() {
    const labels = ["—"];
    state.data.domains.forEach((dom) => {
      //labels.push(dom.name || "");
      (dom.projects || []).forEach((pr) => {
        //labels.push(pr.name || "");
        (pr.versions || []).forEach((vr) => {
          //labels.push(vr.name || "");
          (vr.tasks || []).forEach((tk) => {
            (tk.plans || []).forEach((pl) => labels.push(pl.name || ""));
          });
        });
      });
    });
    const minsize = 100;
    const canvas = document.createElement("canvas");
    const ctx = canvas.getContext("2d");
    if (!ctx) return minsize;
    ctx.font = "11px " + getComputedStyle(document.documentElement).getPropertyValue("--font").trim();
    let maxW = 0;
    labels.forEach((txt) => {
      const w = ctx.measureText(String(txt)).width;
      if (w > maxW) maxW = w;
    });
    return Math.max(minsize, Math.ceil(maxW) + 15);
  }

  function renderGantt(datesOverride) {
    const dates = datesOverride || getDateRange(state);
    state.lastRenderedDates = dates.slice();
    const commentRefs = [];
    const tbl = document.createElement("table");
    tbl.className = "gantt";
    const treeHead2W = computeTreeHead2WidthPx();
    tbl.style.setProperty("--tree-head2-w", treeHead2W + "px");

    colgroup.innerHTML = '<col class="treeHead" style="width:var(--tree-head1-w)" /><col class="treeHead2" style="width:' + treeHead2W + 'px" />' +
      dates.map(() => '<col style="width:28px" />').join("");
    tbl.appendChild(colgroup);
    const thead = document.createElement("thead");
    const tbody = document.createElement("tbody");
    tbl.appendChild(thead);
    tbl.appendChild(tbody);

    function addDayHeaderRow(rowClass, textFn, bgFn) {
      const tr = document.createElement("tr");
      tr.className = rowClass;
      // const th1 = document.createElement("th");
      // th1.className = "treeHead";

            // コメント表示イベント

        tr.appendChild(th);

    function addGroupedHeaderRow(rowClass, textFn, bgFn) {

          if (state.commentDisplayMode === "always") state.commentContextKey = null;
          // renderAll();
          renderGantt();
        });

        // 左ペイン:情報入力パネル表示切替ボタン
        const bLeftPaneToggle = document.createElement("button");
        bLeftPaneToggle.type = "button";
        bLeftPaneToggle.textContent = state.inputPaneVisible ? "Close:左パネル" : "Open:左パネル";
        bLeftPaneToggle.addEventListener("click", () => {

        });

        // 今日の位置を表示
        const bJumpToday = document.createElement("button");

        bJumpToday.addEventListener("click", () => {
          const today = document.querySelector("table.gantt tr.calDay .today");
          scrollGanttToElem(today, { inline: "center" });
        });

        // 人工概略集計
        const bSummary = document.createElement("button");

        bSummary.addEventListener("click", (e) => {

            manhourSummaryPopup.style.display = "none";

      td.className = "manhourCell";
      // td.dataset.date = ds;
      td.colSpan = dates.length;

    function createManhoursRowBranchHeader(kind, mhKind, label, isExpanded, isExpandKey, d_case, d_dom, d_prj, d_ver, d_mem, depth) {
      let fixLabel = label + " (" + (isExpanded ? "▼" : "▶") + ")";
      if (depth !== 0) fixLabel = "└ " + fixLabel;
      const tr = createManhoursRowBase(fixLabel, depth);
      tr.className += ` manhoursDetailRowBranch manhoursDetailRowDepth_${depth}`;
      tr.dataset.mhKind = mhKind;
      tr.dataset.depth = depth;
      //const e_act = selectedDomRow.querySelector(".manhoursHead");
      const e_act = tr;
      
      switch (kind) {
        case TOTAL_KIND_CASE:
          if (d_case) tr.dataset.caseId = d_case.id;
          if (e_act) {
            e_act.addEventListener("click", (e) => {
              e.stopPropagation();
              state.caseExpanded[isExpandKey] = !isExpanded;
              state.data.caseExpanded[isExpandKey] = state.caseExpanded[isExpandKey];
              renderGantt();
            });
          }
          break;

        case TOTAL_KIND_DOMAIN:
          if (d_dom) tr.dataset.domainId = d_dom.id;
          if (e_act) {
            e_act.addEventListener("click", (e) => {
              e.stopPropagation();
              state.domainExpanded[isExpandKey] = !isExpanded;
              state.data.domainExpanded[isExpandKey] = state.domainExpanded[isExpandKey];
              renderGantt();
            });
          }
          break;

        case TOTAL_KIND_PROJECT:
          if (d_prj) tr.dataset.projectId = d_prj.id;
          if (e_act) {
            e_act.addEventListener("click", (e) => {
              e.stopPropagation();
              state.projectExpanded[isExpandKey] = !isExpanded;
              state.data.projectExpanded[isExpandKey] = state.projectExpanded[isExpandKey];
              renderGantt();
            });
          }
          break;

        case TOTAL_KIND_MEMBER:
          if (d_mem) tr.dataset.memberId = d_mem.id;
          if (e_act) {
            e_act.addEventListener("click", (e) => {
              e.stopPropagation();
              state.memberExpanded[isExpandKey] = !isExpanded;
              state.data.memberExpanded[isExpandKey] = state.memberExpanded[isExpandKey];
              renderGantt();
            });
          }
          break;
      }

      return tr;
    }
    function createManhoursRowBranch(mhData, kind, mhKind, label, isExpanded, isExpandKey, d_case, d_dom, d_prj, d_ver, d_mem, depth) {
      const tr = createManhoursRowBranchHeader(kind, mhKind, label, isExpanded, isExpandKey, d_case, d_dom, d_prj, d_ver, d_mem, depth);
      createManhoursRowBody(tr, mhData);
      return tr;
    }

    // 階層化して集計する人工集計のうち最下層の人工集計行作成処理
    // 子階層の展開処理を持たない
    function createManhoursRowTailHeader(kind, mhKind, label, d_case, d_dom, d_prj, d_ver, d_mem, depth) {
      const fixLabel = (depth === 0) ? label : "└ " + label;
      const tr = createManhoursRowBase(fixLabel, depth);
      tr.className += ` manhoursDetailRowDepth_${depth}`;
      tr.dataset.mhKind = mhKind;
      tr.dataset.depth = depth;
      switch (kind) {
        case TOTAL_KIND_CASE:
          if (d_case) tr.dataset.caseId = d_case.id;
          break;
        case TOTAL_KIND_DOMAIN:
          if (d_dom) tr.dataset.domainId = d_dom.id;
          break;
        case TOTAL_KIND_PROJECT:
          if (d_prj) tr.dataset.projectId = d_prj.id;
          break;
        case TOTAL_KIND_MEMBER:
          if (d_mem) tr.dataset.memberId = d_mem.id;
          break;
      }
      return tr;
    }
    function createManhoursRowTail(mhData, kind, mhKind, label, d_case, d_dom, d_prj, d_ver, d_mem, depth) {
      const tr = createManhoursRowTailHeader(kind, mhKind, label, d_case, d_dom, d_prj, d_ver, d_mem, depth);
      createManhoursRowBody(tr, mhData);
      return tr;
    }

    // 集計パターンに応じて集計行を作成
    // 人工集計表示展開設定のときに実施
    if (state.manhoursExpanded) {
      const caseFilterCount = state.caseFilter.length;
      const ptns = state.totalPatternList;

      // 人工集計データ作成
      const mhData = totalManhoursByPattern(state, dates, ptns);
      const hasActualManhours = manhoursDataHasActual(mhData);

      // データ内容が空の集計行を一括で作成
      let expandKey = "";

      const createManhoursRowCase = (mhRowList, mhRowMap, ptns, ptn_idx, expandKey, d_case, d_dom, d_prj, d_ver, d_mem, depth, isSelectedTotal) => {
        //
        if (ptn_idx >= ptns.length) return;
        // 末尾データチェック
        const isTail = (ptn_idx == ptns.length-1);

        // 複数caseフィルタ選択
        if (caseFilterCount >= 2) {
          const selectedCases = state.caseFilter
            .map((id) => state.data.cases.find((c) => c.id === id))
            .filter((c) => !!c);
          if (selectedCases.length >= 2) {
            const selectedCaseIds = selectedCases.map((c) => c.id);
            const selectedCaseLabel = selectedCases.map((c) => c.name || c.id).join(" + ");
            const selectedCaseKey = expandKey + selectedCaseIds.join("|");
            if (state.caseExpanded[selectedCaseKey] == null) state.caseExpanded[selectedCaseKey] = (depth < 1);
            const isExpanded = state.caseExpanded[selectedCaseKey] !== false;

            const row = isTail
              ? createManhoursRowTailHeader(TOTAL_KIND_CASE, "caseSelectedTotal", selectedCaseLabel, d_case, d_dom, d_prj, d_ver, d_mem, depth)
              : createManhoursRowBranchHeader(TOTAL_KIND_CASE, "caseSelectedTotal", selectedCaseLabel, isExpanded, selectedCaseKey, d_case, d_dom, d_prj, d_ver, d_mem, depth);

            mhRowList.push(row);
            mhRowMap.caseFilter = [ row, {} ];

            // 子階層処理
            if (isExpanded) createManhoursRow(mhRowList, mhRowMap.caseFilter[1], ptns, ptn_idx+1, selectedCaseKey+"::", d_case, d_dom, d_prj, d_ver, d_mem, depth+1, true);
          }
        }
        // case
        state.data.cases.filter(caseMatchesCaseFilter).forEach((cse) => {
          // Case別総合行
          const caseKey = expandKey + cse.id;
          if (state.caseExpanded[caseKey] == null) state.caseExpanded[caseKey] = (depth < 1);
          const isExpanded = state.caseExpanded[caseKey] !== false;

          const row = isTail
            ? createManhoursRowTailHeader(TOTAL_KIND_CASE, "case", cse.name, cse, d_dom, d_prj, d_ver, d_mem, depth)
            : createManhoursRowBranchHeader(TOTAL_KIND_CASE, "case", cse.name, isExpanded, caseKey, cse, d_dom, d_prj, d_ver, d_mem, depth);

          mhRowList.push(row);
          mhRowMap[cse.id] = [ row, {} ];

          // 子階層処理
          if (isExpanded) createManhoursRow(mhRowList, mhRowMap[cse.id][1], ptns, ptn_idx+1, caseKey+"::", cse, d_dom, d_prj, d_ver, d_mem, depth+1, false);
        });
      }

      const createManhoursRowDomain = (mhRowList, mhRowMap, ptns, ptn_idx, expandKey, d_case, d_dom, d_prj, d_ver, d_mem, depth, isSelectedTotal = false) => {
        //
        if (ptn_idx >= ptns.length) return;
        // 末尾データチェック
        const isTail = (ptn_idx == ptns.length-1);
        // 集計行作成
        state.data.domains.forEach((dom) => {
          const domainKey = expandKey + dom.id;
          if (state.domainExpanded[domainKey] == null) state.domainExpanded[domainKey] = (depth < 1);
          const isExpanded = state.domainExpanded[domainKey] !== false;
          const mhKind = isSelectedTotal ? "domainSelectedTotal" : "domain";
          const row = isTail
            ? createManhoursRowTailHeader(TOTAL_KIND_DOMAIN, mhKind, dom.name, d_case, dom, d_prj, d_ver, d_mem, depth)
            : createManhoursRowBranchHeader(TOTAL_KIND_DOMAIN, mhKind, dom.name, isExpanded, domainKey, d_case, dom, d_prj, d_ver, d_mem, depth);

          mhRowList.push(row);
          mhRowMap[dom.id] = [ row, {} ];

          // 子階層処理
          if (isExpanded) createManhoursRow(mhRowList, mhRowMap[dom.id][1], ptns, ptn_idx+1, domainKey+"::", d_case, dom, d_prj, d_ver, d_mem, depth+1, isSelectedTotal);
        });
      }

      const createManhoursRowProject = (mhRowList, mhRowMap, ptns, ptn_idx, expandKey, d_case, d_dom, d_prj, d_ver, d_mem, depth, isSelectedTotal = false) => {
        //
        if (ptn_idx >= ptns.length) return;
        // 末尾データチェック
        const isTail = (ptn_idx == ptns.length-1);
        // 集計行作成
        state.data.domains.forEach((dom) => {
          // domainの子階層としてprojectを表示するとき、実際にdomainの配下にあるprojectのみ表示する
          if (d_dom && d_dom.id !== dom.id) return;

          (dom.projects || []).forEach((pr) => {
            const projectKey = expandKey + pr.id;
            if (state.projectExpanded[projectKey] == null) state.projectExpanded[projectKey] = (depth < 1);
            const isExpanded = state.projectExpanded[projectKey] !== false;
            const mhKind = isSelectedTotal ? "projectSelectedTotal" : "project";
            const row = isTail
              ? createManhoursRowTailHeader(TOTAL_KIND_PROJECT, mhKind, pr.name, d_case, dom, pr, d_ver, d_mem, depth)
              : createManhoursRowBranchHeader(TOTAL_KIND_PROJECT, mhKind, pr.name, isExpanded, projectKey, d_case, dom, pr, d_ver, d_mem, depth);

            mhRowList.push(row);
            mhRowMap[pr.id] = [ row, {} ];

            // 子階層処理
            if (isExpanded) createManhoursRow(mhRowList, mhRowMap[pr.id][1], ptns, ptn_idx+1, projectKey+"::", d_case, dom, pr, d_ver, d_mem, depth+1, isSelectedTotal);
          });
        });
      }

      const createManhoursRowMember = (mhRowList, mhRowMap, ptns, ptn_idx, expandKey, d_case, d_dom, d_prj, d_ver, d_mem, depth, isSelectedTotal = false) => {
        //
        if (ptn_idx >= ptns.length) return;
        // 末尾データチェック
        const isTail = (ptn_idx == ptns.length-1);
        // 集計行作成
        state.data.members.forEach((mem) => {
          const memKey = expandKey + mem.id;
          if (state.memberExpanded[memKey] == null) state.memberExpanded[memKey] = (depth < 1);
          const isExpanded = state.memberExpanded[memKey] !== false;
          const mhKind = isSelectedTotal ? "memberSelectedTotal" : "member";
          const row = isTail
            ? createManhoursRowTailHeader(TOTAL_KIND_MEMBER, mhKind, mem.name, d_case, d_dom, d_prj, d_ver, mem, depth)
            : createManhoursRowBranchHeader(TOTAL_KIND_MEMBER, mhKind, mem.name, isExpanded, memKey, d_case, d_dom, d_prj, d_ver, mem, depth);

          mhRowList.push(row);
          mhRowMap[mem.id] = [ row, {} ];

          // 子階層処理
          if (isExpanded) createManhoursRow(mhRowList, mhRowMap[mem.id][1], ptns, ptn_idx+1, memKey+"::", d_case, d_dom, d_prj, d_ver, mem, depth+1, isSelectedTotal);
        });
      }

      function createManhoursRow(mhRowList, mhRowMap, ptns, ptn_idx, expandKey, d_case, d_dom, d_prj, d_ver, d_mem, depth, isSelectedTotal) {
        if (ptns.length <= ptn_idx) return;
        const ptn = ptns[ptn_idx];
        switch (ptn) {
          case TOTAL_KIND_CASE:
            createManhoursRowCase(mhRowList, mhRowMap, ptns, ptn_idx, expandKey, d_case, d_dom, d_prj, d_ver, d_mem, depth, isSelectedTotal);
            break;
          case TOTAL_KIND_DOMAIN:
            createManhoursRowDomain(mhRowList, mhRowMap, ptns, ptn_idx, expandKey, d_case, d_dom, d_prj, d_ver, d_mem, depth, isSelectedTotal);
            break;
          case TOTAL_KIND_PROJECT:
            createManhoursRowProject(mhRowList, mhRowMap, ptns, ptn_idx, expandKey, d_case, d_dom, d_prj, d_ver, d_mem, depth, isSelectedTotal);
            break;
          case TOTAL_KIND_MEMBER:
            createManhoursRowMember(mhRowList, mhRowMap, ptns, ptn_idx, expandKey, d_case, d_dom, d_prj, d_ver, d_mem, depth, isSelectedTotal);
            break;
        }
      }


      function createManhoursRowBody(mhData, mhRowMap) {
        const makeBody = (ds, data, map) => {
          Object.keys(map).forEach((key) => {
            // 
            const obj = map[key];
            const tr = obj[0];
            // 当日の総工数を取得
            const mhobj = (key === "caseFilter") ? data?.caseFilter : data?.detail[key];
            const totalKind = tr.dataset.mhCellKind === "actual" ? "actual" : "plan";
            const totalHours = (mhobj && mhobj.total) ? (mhobj.total[totalKind] || 0) : 0;
            tr.dataset.mhTotalHours = String(Number(tr.dataset.mhTotalHours || 0) + totalHours);
            //
            const td = document.createElement("td");
            td.className = "manhourCell";
            td.dataset.date = ds;
            
            // 人工 = 工数 / 8hr
            const manHours = (totalHours / 8).toFixed(1);
            td.textContent = manHours;
            td.title = totalHours + "hr";
            tr.appendChild(td);

            //
            makeBody(ds, mhobj, obj[1]);
          });
        }

        dates.forEach((ds) => {
          const data = mhData[ds];
          makeBody(ds, data, mhRowMap);
        });
      }

      // header要素まで作成
      const mhRowList = [];
      const mhRowMap = {};
      let actualMhRowList = [];
      const showPlanRow = state.summaryMode !== "actual";
      const showActualRow = hasActualManhours && state.summaryMode !== "plan";
      
      // ラベルサフィックス設定
      if (state.summaryMode === "both" && hasActualManhours) {
        manhoursRowLabelSuffix = "(計画)";
      } else {
        manhoursRowLabelSuffix = "";
      }
      
      // 計画行作成
      if (showPlanRow) {
        manhoursRowCellKind = "plan";
        createManhoursRow(mhRowList, mhRowMap, ptns, 0, expandKey, null, null, null, null, null, 0, false);
        createManhoursRowBody(mhData, mhRowMap);
      }
      
      // 実績行作成
      if (showActualRow) {
        const actualMhRowMap = {};
        manhoursRowLabelSuffix = "(実績)";
        manhoursRowCellKind = "actual";
        createManhoursRow(actualMhRowList, actualMhRowMap, ptns, 0, expandKey, null, null, null, null, null, 0, false);
        createManhoursRowBody(mhData, actualMhRowMap);
      }
      
      // thead への行追加
      mhRowList.forEach((tr, idx) => {
        thead.appendChild(tr);
        if (showActualRow) {
          const actualTr = actualMhRowList[idx];
          if (actualTr && Number(actualTr.dataset.mhTotalHours || 0) > 1e-6) thead.appendChild(actualTr);
        }
      });
      if (mhRowList.length === 0 && showActualRow) {
        // 計画行がない場合、実績行だけ追加
        actualMhRowList.forEach((tr) => {
          if (Number(tr.dataset.mhTotalHours || 0) > 1e-6) thead.appendChild(tr);
        });
      }

      // state.data.domains.forEach((dom) => {
      //   (dom.projects || []).forEach((pr) => {
      //     (pr.versions || []).forEach((vr) => {
      //       state.data.members.forEach((mem) => {
      //       });

      //       (vr.tasks || []).forEach((tk) => {
      //         (tk.plans || []).forEach((pl) => {
      //           // フィルタケア
      //           if (!planMatchesCaseFilter(pl)) return;
      //           // 対象日付の稼働ManHourを取得
      //           const mh = dayHoursAll(pl, ds);
      //           // 稼働日でなければスキップ
      //           if (mh == 0) return;

      //           // ルート要素作成
      //           if (!totalHours[ds]) totalHours[ds] = { total: 0, detail: {} };
      //           const dateNode = totalHours[ds];

      //         });
      //       });
      //     });
      //   });
      // });
    }

    function addDPVRow(label, target, kind) {
      const tr = document.createElement("tr");
      tr.className = "treeRow dpvRow dpv-" + kind;
      const tdLabel = document.createElement("td");
      tdLabel.colSpan = 2;
      tdLabel.className = "treeHead";
      tdLabel.textContent = label;
      tdLabel.addEventListener("click", () => {
        const selector = kind === "domain" ? "[data-id='" + target.id + "'].inputPaneDomain" :
                         kind === "project" ? "[data-id='" + target.id + "'].inputPaneProject" :
                         kind === "version" ? "[data-id='" + target.id + "'].inputPaneVersion" : null;
        if (selector) {
          const el = leftPane.querySelector(selector);
          if (el) {
            el.scrollIntoView({ behavior: "auto", block: "start" });
          }
        }
      });
      tr.appendChild(tdLabel);
      dates.forEach(() => {
        const c = document.createElement("td");
        tr.appendChild(c);
      });
      const startIdx = 1;
      dates.forEach((ds, i) => {
        const key = commentRefKey(kind, target, ds);
        const c = tr.children[startIdx + i];

        if (getCellComment(target, ds).trim()) {
          const dot = document.createElement("span");
          dot.className = "commentDot";
          dot.dataset.commentRef = key;
          c.appendChild(dot);
          commentRefs.push({ key, kind, label, target, date: ds, dot });
        }
        c.addEventListener("contextmenu", (e) => {
          e.preventDefault();
          e.stopPropagation();
          openCommentPopup(target, ds, kind + ":" + label, c, key);
        });
      });
      tbody.appendChild(tr);
    }

    function appendPlanDayCells(tr_plan, tr_act, dom, pr, vr, pl, isPlanMode) {
      dates.forEach((ds) => {
        const key = commentRefKey("plan", pl, ds);
        const td_plan = document.createElement("td");
        td_plan.className = "daycell";
        const td_act = document.createElement("td");
        td_act.className = "daycell";

        const makeFill = (cellKind, td) => {
          const hrs = dayHoursAll(pl, ds, cellKind);
          const base = planBarColor(pl, state);
          const holType = holidayTypeForDate(ds, pl, state) || todayTypeForDate(ds, state);
          const fill = document.createElement("span");
          fill.className = "fill";
          if (hrs > 0) {
            td.style.background = base;
            fill.style.background = "transparent";
          } else {
            td.style.background = holidayBgColor(holType) || "";
            fill.style.background = "";
          }
          const uShow = cellIsOn(pl, ds, cellKind) && Math.abs(effectiveCellUtil(pl, ds, cellKind) - (pl.utilization || 1)) > 1e-5;
          fill.textContent = uShow ? String(effectiveCellUtil(pl, ds, cellKind)) : "";

          return fill;
        };
        const fillPlan = makeFill(cellKindPlan, td_plan);
        td_plan.appendChild(fillPlan);

        td_plan.dataset.date = ds;
        td_plan.dataset.planId = pl.id;
        td_plan.dataset.cellKind = "plan";

        if (isPlanMode) {
          // Planモード
          td_plan.rowSpan = 2;
        } else {
          // Actualモード
          td_act.dataset.date = ds;
          td_act.dataset.planId = pl.id;
          td_act.dataset.cellKind = "actual";
          const fillAct = makeFill(cellKindActual, td_act);
          td_act.appendChild(fillAct);
        }

        if (getCellComment(pl, ds).trim()) {
          const dot = document.createElement("span");
          dot.className = "commentDot";
          dot.dataset.commentRef = key;
          td_plan.appendChild(dot);
          commentRefs.push({ key, kind: "plan", label: pl.name, target: pl, date: ds, dot });
        }

        const bindEditEvents = (td, cellKind, editable) => {
          if (!editable) {
            td.style.cursor = "default";
            return;
          }
          td.addEventListener("mousemove", (e) => {
            const r = td.getBoundingClientRect();
            const localX = e.clientX - r.left;
            const m = planCellInteractionMode(pl, ds, localX, r.width, dates, cellKind);
            td.style.cursor = cursorForPlanCellMode(m) || "cell";
          });
          td.addEventListener("mouseleave", () => {
            td.style.cursor = "";
          });
          td.addEventListener("pointerdown", (e) => onCellPointerDown(e, pl, ds, dates, cellKind));
        };

        td_plan.addEventListener("contextmenu", (e) => {
          e.preventDefault();
          e.stopPropagation();
          openCommentPopup(pl, ds, "plan:" + pl.name, td_plan, key);
        });

        bindEditEvents(td_plan, cellKindPlan, !!pl.isPlanOrActual);
        tr_plan.appendChild(td_plan);
        if (isPlanMode) {
          // Planモード
        } else {
          // Actualモード
          bindEditEvents(td_act, cellKindActual, !pl.isPlanOrActual);
          tr_act.appendChild(td_act);
        }
      });
    }

    function appendTaskPlanRows(dom, pr, vr, tk) {
      const vis = (tk.plans || []).filter(planMatchesCaseFilter);
      const n = Math.max(1, vis.length);
      if (vis.length === 0) {
        const tr = document.createElement("tr");
        tr.className = "treeRow";
        const t2 = document.createElement("td");
        t2.className = "treeHead nameCell";
        t2.textContent = tk.name;
        t2.addEventListener("click", () => {
          scrollLeftTaskIntoView(tk.id);
        });
        const t3 = document.createElement("td");
        t3.className = "treeHead2 muted";
        t3.textContent = "—";
        tr.appendChild(t2);
        tr.appendChild(t3);
        dates.forEach(() => {
          const c = document.createElement("td");
          c.className = "daycell";
          c.style.background = "#eee";
          tr.appendChild(c);
        });
        tbody.appendChild(tr);
        return;
      }
      vis.forEach((pl, i) => {
        const tr_plan = document.createElement("tr");
        const tr_act = document.createElement("tr");
        tr_plan.className = "planRow" + (state.selectedPlanId === pl.id ? " selected" : "");
        tr_plan.dataset.planId = pl.id;
        tr_act.className = "actualRow" + (state.selectedPlanId === pl.id ? " selected" : "");
        tr_act.dataset.planId = pl.id;
        if (i === 0) {
          const t2 = document.createElement("td");
          t2.className = "treeHead nameCell";
          t2.rowSpan = n * 2;
          // t2.textContent = tk.name;
          t2.innerHTML = tk.name;
          
          // Taskのコメント表示
          if (getNodeComment(tk).trim()) {
            const dot = document.createElement("span");
            dot.style.position = "absolute";
            dot.style.top = "2px";
            dot.style.right = "2px";
            dot.style.width = "5px";
            dot.style.height = "5px";
            dot.style.borderRadius = "50%";
            dot.style.background = "#b0293a";
            dot.style.cursor = "pointer";
            dot.title = "コメントあり";
            dot.addEventListener("click", (e) => {
              e.stopPropagation();
              openCommentPopup(tk, null, "Task: " + tk.name, dot);
            });
            t2.appendChild(dot);
          }
          
          t2.addEventListener("click", () => {
            scrollLeftTaskIntoView(tk.id);
          });
          t2.addEventListener("contextmenu", (e) => {
            e.preventDefault();
            e.stopPropagation();
            openCommentPopup(tk, null, "Task: " + tk.name, t2);
          });
          tr_plan.appendChild(t2);
        }
        const tPlan = document.createElement("td");
        tPlan.className = "treeHead2 nameCell";
        tPlan.textContent = pl.name;
        tPlan.rowSpan = 2;
        
        // Plan のコメント表示
        if (getNodeComment(pl).trim()) {
          const dot = document.createElement("span");
          dot.style.position = "absolute";
          dot.style.top = "2px";
          dot.style.right = "2px";
          dot.style.width = "5px";
          dot.style.height = "5px";
          dot.style.borderRadius = "50%";
          dot.style.background = "#b0293a";
          dot.style.cursor = "pointer";
          dot.title = "コメントあり";
          dot.addEventListener("click", (e) => {
            e.stopPropagation();
            openCommentPopup(pl, null, "Plan: " + pl.name, dot);
          });
          tPlan.appendChild(dot);
          //commentRefs.push({ key: null, kind: "plan", label: pl.name, target: pl, date: null, dot });
        }
        
        tPlan.addEventListener("click", () => {
          state.selectedPlanId = pl.id;
          applySelectedPlanDom(state.selectedPlanId);
          scrollLeftPlanIntoView(state.selectedPlanId);
        });
        tPlan.addEventListener("contextmenu", (e) => {
          e.preventDefault();
          e.stopPropagation();
          openCommentPopup(pl, null, "Plan: " + pl.name, tPlan);
        });

        // 表示モード作成:
        // pl.isPlanOrActual===true and pl.actualCellsが空 -> Planモード（1行表示、セルはplanデータ参照）
        // そうでない場合はActualモード（planとactualの2行表示、セルはそれぞれのデータ参照）
        const isPlanMode = pl.isPlanOrActual && (!pl.actualCells || Object.keys(pl.actualCells).length === 0);

        if (isPlanMode) {
          // Planモード
          tr_plan.classList.add("isPlanning");
          tr_act.classList.add("isPlanning");
        } else {
          // Actualモード
          tr_plan.classList.add("isActual");
          tr_act.classList.add("isActual");
        }
        tr_plan.appendChild(tPlan);
        appendPlanDayCells(tr_plan, tr_act, dom, pr, vr, pl, isPlanMode);
        tbody.appendChild(tr_plan);
        tbody.appendChild(tr_act);
      });
    }

    // DPV/Task 描画にフィルタを適用する
    const tf = (state.data && state.data.treeFilter) ? state.data.treeFilter : { domains: {}, projects: {}, versions: {} };
    const displayLevel = state.filterDisplayLevel || "project";
    state.data.domains.forEach((dom) => {
      if (tf.domains && tf.domains[dom.id] === false) return; // domain が OFF の場合は配下をスキップ
      addDPVRow(dom.name, dom, "domain");
      (dom.projects || []).forEach((pr) => {
        if (tf.projects && tf.projects[pr.id] === false) return; // project OFF
        addDPVRow(pr.name, pr, "project");
        (pr.versions || []).forEach((vr) => {
          if (displayLevel === "version" && tf.versions && tf.versions[vr.id] === false) return; // version OFF かつ表示対象
          addDPVRow(vr.name, vr, "version");
          (vr.tasks || []).forEach((tk) => {
            appendTaskPlanRows(dom, pr, vr, tk);
          });
        });
      });
    });

    const stage = document.createElement("div");
    stage.className = "ganttStage";
    stage.appendChild(tbl);
    const lineLayer = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    lineLayer.setAttribute("class", "commentLineLayer");
    commentLayer = document.createElement("div");
    commentLayer.className = "commentLayer";
    milestoneLineLayer = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    milestoneLineLayer.setAttribute("class", "milestoneLineLayer commentLineLayer");
    milestoneLayer = document.createElement("div");
    milestoneLayer.className = "milestoneLayer commentLayer";
    stage.appendChild(lineLayer);
    stage.appendChild(commentLayer);
    stage.appendChild(milestoneLineLayer);
    stage.appendChild(milestoneLayer);

    function clampCommentPos(x, y, cardW, cardH) {
      const maxX = Math.max(0, stage.offsetWidth - cardW - 4);
      const maxY = Math.max(0, stage.offsetHeight - cardH - 4);
      return { x: Math.min(Math.max(0, x), maxX), y: Math.min(Math.max(0, y), maxY) };
    }

    function drawCommentOverlay() {
      const showAll = state.commentDisplayMode === "always";
      const refs = showAll
        ? commentRefs
        : commentRefs.filter((r) => r.key === state.commentContextKey);
      commentLayer.innerHTML = "";
      while (lineLayer.firstChild) lineLayer.removeChild(lineLayer.firstChild);
      const rect = stage.getBoundingClientRect();
      lineLayer.setAttribute("width", String(stage.offsetWidth));
      lineLayer.setAttribute("height", String(stage.offsetHeight));
      lineLayer.style.width = stage.offsetWidth + "px";
      lineLayer.style.height = stage.offsetHeight + "px";
      commentLayer.style.width = stage.offsetWidth + "px";
      commentLayer.style.height = stage.offsetHeight + "px";
      milestoneLineLayer.setAttribute("width", String(stage.offsetWidth));
      milestoneLineLayer.setAttribute("height", String(stage.offsetHeight));
      milestoneLineLayer.style.width = stage.offsetWidth + "px";
      milestoneLineLayer.style.height = stage.offsetHeight + "px";
      milestoneLayer.style.width = stage.offsetWidth + "px";
      milestoneLayer.style.height = stage.offsetHeight + "px";
      refs.forEach((ref) => {
        let text;
        if (ref.kind === "milestone") {
          text = getMilestoneComment(ref.target);
        } else {
          text = ref.date ? getCellComment(ref.target, ref.date) : getNodeComment(ref.target);
        }
        if (!text.trim()) return;
        const dotR = ref.dot.getBoundingClientRect();
        const dotX = dotR.left - rect.left + dotR.width / 2;
        const dotY = dotR.top - rect.top + dotR.height / 2;
        const card = document.createElement("div");
        card.className = ref.date ? "commentCard" : "nodeCommentCard";
        card.textContent = text;
        let saved;
        if (ref.kind === "milestone") {
          milestoneLayer.appendChild(card);
          saved = getMilestoneCommentPos(ref.target);
        } else {
          commentLayer.appendChild(card);
          saved = ref.date ? getCellCommentPos(ref.target, ref.date) : getNodeCommentPos(ref.target);
        }
        const cw = card.offsetWidth;
        const ch = card.offsetHeight;
        // 相対座標を絶対座標に変換
        const absDotY = dotY - ganttVScroll.scrollTop;
        const baseX = (saved ? dotX + saved.x : dotX + 12);
        const baseY = (saved ? absDotY + saved.y : absDotY - 38);
        const pos = clampCommentPos(baseX, baseY, cw, ch);
        card.style.left = pos.x + "px";
        card.style.top = pos.y + "px";

        const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
        line.setAttribute("stroke-width", "1.2");
        line.setAttribute("stroke-opacity", "0.9");
        if (ref.kind === "milestone") {
          line.setAttribute("stroke", "#ff9800");
          milestoneLineLayer.appendChild(line);
        } else {
          line.setAttribute("stroke", "#b0293a");
          lineLayer.appendChild(line);
        }
        const updateLine = () => {
          const cx = parseFloat(card.style.left) || 0;
          const cy = parseFloat(card.style.top) || 0;
          line.setAttribute("x1", String(dotX));
          line.setAttribute("y1", String(absDotY));
          line.setAttribute("x2", String(cx));
          line.setAttribute("y2", String(cy + 10));
        };
        updateLine();

        card.addEventListener("pointerdown", (ev) => {
          if (ev.button !== 0) return;
          ev.preventDefault();
          ev.stopPropagation();
          const sx = ev.clientX;
          const sy = ev.clientY;
          const ox = parseFloat(card.style.left) || 0;
          const oy = parseFloat(card.style.top) || 0;
          card.setPointerCapture(ev.pointerId);
          const onMv = (mv) => {
            const nx = ox + (mv.clientX - sx);
            const ny = oy + (mv.clientY - sy);
            const cl = clampCommentPos(nx, ny, cw, ch);
            card.style.left = cl.x + "px";
            card.style.top = cl.y + "px";
            updateLine();
          };
          const onUp = (up) => {
            card.releasePointerCapture(up.pointerId);
            card.removeEventListener("pointermove", onMv);
            card.removeEventListener("pointerup", onUp);
            const px = parseFloat(card.style.left) || 0;
            const py = parseFloat(card.style.top) || 0;
            // 絶対座標を相対座標に変換して保存
            const relX = px - dotX;
            const relY = py - absDotY;
            if (ref.kind === "milestone") {
              setMilestoneCommentPos(ref.target, { x: relX, y: relY });
            } else if (ref.date) {
              setCellCommentPos(ref.target, ref.date, { x: relX, y: relY });
            } else {
              setNodeCommentPos(ref.target, { x: relX, y: relY });
            }
            markDirty(state, true);
            //renderGantt(dates);
          };
          card.addEventListener("pointermove", onMv);
          card.addEventListener("pointerup", onUp);
        });
      });
    }

    ganttVScroll.innerHTML = "";
    ganttVScroll.appendChild(stage);
    drawCommentOverlay();
    syncMilestoneLayerToScroll();
    if (manhourSummaryPopup && manhourSummaryPopup.style.display !== "none") {
      renderManhourSummaryPopup();
    }
  }

  function actualHoursOnDate(pl, ds, state) {
    const tot = Number((pl.phaseHours.all && pl.phaseHours.all.actual) || 0);
    if (tot <= 0) return 0;
    if (!pl.actualStart || !pl.actualEnd) return 0;
    if (daysBetween(pl.actualStart, ds) >= 0 && daysBetween(ds, pl.actualEnd) >= 0) {
      const span = Math.max(1, daysBetween(pl.actualStart, pl.actualEnd) + 1);
      return tot / span;
    }
    return 0;
  }

  function inputCellUtil(plan, ds, cellKind) {
    const cells = getCellsByKind(plan, cellKind);
    const cell = cells[ds] || (cells[ds] = {});
    const u0 = plan.utilization == null ? 1 : Number(plan.utilization);
    const curU = effectiveCellUtil(plan, ds, cellKind);

    // クリックされたセル要素を検索
    const kind = cellKind === cellKindPlan ? "plan" : "actual";
    const td = ganttVScroll.querySelector('td.daycell[data-plan-id="' + plan.id + '"][data-date="' + ds + '"][data-cell-kind="' + kind + '"]');
    const spn = td.querySelector('span');
    const curText = spn.textContent;
    let canceled = false;
    spn.textContent = String(curU);
    spn.contentEditable = "true";
    spn.focus();
    // テキストを全選択
    document.execCommand("selectAll", false, null);
    const onChange = () => {
      const new_txt = spn.textContent.trim();
      // 入力値を数値として解析
      let val = Number(new_txt);
      if (isNaN(val)) {
        alert("有効な数値を入力してください（0で削除）");
        spn.textContent = String(curU);
        spn.focus();
        return;
      }
      //
      spn.removeEventListener("blur", onChange);
      spn.removeEventListener("keydown", onKey);
      // 変化なしでキャンセル
      if (canceled) {
        spn.contentEditable = "false";
        return;
      }
      // 空白で0扱い
      if (new_txt === "") {
        val = 0;
      }
      //
      if (val < 1e-5) {
        delete cell.util;
      } else {
        if (val != plan.utilization) {
          cell.util.value = val;
        } else {
          delete cell.util.value;
        }
      }
      if (Object.keys(cell).length === 0) {
        delete cells[ds];
      }
      spn.contentEditable = "false";
      updatePlanCellDomByData(plan, ds, cells[ds] || cell, null, cellKind);
      recomputeAllPhaseFromCells(plan);
      plan.plannedEnd = computePlannedEnd(plan, state);
      markDirty(state, true);
      syncLeftPanePlanSummaryDom(plan.id, plan.isPlanOrActual);
      refreshManhoursRowsDom([ds], cellKind === cellKindActual);
    };
    spn.addEventListener("blur", onChange);
    // Enterキーで確定、Escキーでキャンセル
    const onKey = (e) => {
      if (e.key === "Enter") {
        onChange();
      } else if (e.key === "Escape") {
        spn.textContent = curText;
        canceled = true;
        spn.contentEditable = "false";
      }
    }
    spn.addEventListener("keydown", onKey);

    markDirty(state, true);
  }

  function cycleCellUtil(plan, ds) {
    const cell = plan.cells[ds] || (plan.cells[ds] = {});
    const u0 = plan.utilization == null ? 1 : Number(plan.utilization);
    const seq = [0.5, 1, 1.5, 2, u0];
    const curU = effectiveCellUtil(plan, ds, cellKindPlan);
    const idx = seq.findIndex((u) => Math.abs(u - curU) < 1e-5);
    const next = seq[(Math.max(0, idx) + 1) % seq.length];
    if (Math.abs(next - u0) < 1e-5) {
      if (typeof cell === "object") delete cell.util;
      if (Object.keys(cell).length === 0) delete plan.cells[ds];
    } else if (typeof cell === "object") cell.util = next;
    markDirty(state, true);
  }

  function onCellPointerDown(e, pl, ds, dates, cellKind) {
    if (e.button !== 0) return;
    const td = e.currentTarget;
    const rect = td.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const blk = contiguousBlock(pl, ds, state, dates, cellKind);
    const mode = planCellInteractionMode(pl, ds, x, rect.width, dates, cellKind);
    const srcCells = getCellsByKind(pl, cellKind);
    const startCell = srcCells[ds];
    const startHasUtil = !!(startCell?.util?.value);
    const startUtil = startCell?.util?.value || pl.utilization;
    state.drag = {
      mode,
      planId: pl.id,
      cellKind,
      startDate: ds,
      block: blk,
      startX: e.clientX,
      startHasUtil,
      startUtil,
      orig: cloneCells(srcCells),
      draftCells: cloneCells(srcCells),
      frozenDates: dates.slice(),
      lastStep: 0,
      changed: false,
      dragMoved: false,
      touchedDates: new Set(),
      cellDomCache: buildPlanCellDomCache(pl.id, dates),
    };
    td.setPointerCapture(e.pointerId);
    const pln = findPlan(state, pl.id);
    const onMove = (ev) => {
      const dg0 = state.drag;
      if (!dg0) return;
      if (dg0.mode === "click") {
        if (Math.abs(ev.clientX - dg0.startX) > 4) dg0.dragMoved = true;
        return;
      }
      dg0.dragMoved = true;
      onCellPointerMove(ev, pln);
    };
    const updateStartDate = () => {
      const minCellDate = earliestInputCellDate(pln, pln.isPlanOrActual);
      if (pln.isPlanOrActual == cellKindPlan) {
        if (minCellDate) pln.plannedStart = minCellDate;
      } else {
        if (minCellDate) pln.actualStart = minCellDate;
      }
    }
    const onUp = (ev) => {
      td.releasePointerCapture(ev.pointerId);
      window.removeEventListener("pointermove", onMove);
      window.removeEventListener("pointerup", onUp);
      const dg = state.drag;
      if (dg && pln) {
        if (dg.mode === MOUSE_EV_MODE_CLICK && !dg.dragMoved && pln) {
          const plnCells = getCellsByKind(pln, dg.cellKind);
          if (!cellIsOn(pln, ds, dg.cellKind)) {
            // セルがオフ->オン:稼働率はプラン全体の稼働率をセット
            const util0 = pln.utilization == null ? 1 : Number(pln.utilization);
            let cell = plnCells[ds];
            if (!cell || typeof cell !== "object" || cell === true) cell = {};
            if (!cell.util) cell.util = {};
            plnCells[ds] = cell;
            updatePlanCellDomByData(pln, ds, plnCells[ds], dg.cellDomCache, dg.cellKind);
            updateStartDate();
            recomputeAllPhaseFromCells(pln);
            pln.plannedEnd = computePlannedEnd(pln, state);
            markDirty(state, true);
            syncLeftPanePlanSummaryDom(pln.id, pln.isPlanOrActual);
            refreshManhoursRowsDom([ds], dg.cellKind === cellKindActual);
            if (dg.cellKind === cellKindPlan && shouldRefreshGanttNearRangeEdge(pln, dg.frozenDates || dates || [], pln.cells)) renderGantt();
          }
        } else if (dg.mode === MOUSE_EV_MODE_MOVE && !dg.dragMoved && cellIsOn(pln, ds, dg.cellKind)) {
          // セル移動なし:クリックのみ:稼働率処理
          inputCellUtil(pln, ds, dg.cellKind);
          recomputeAllPhaseFromCells(pln);
          pln.plannedEnd = computePlannedEnd(pln, state);
        } else if (dg.changed) {
          // ドラッグ変更範囲日時を配列として作成
          const changedDates = [];
          const targetCells = getCellsByKind(pln, dg.cellKind);
          const mergedDates = new Set([...Object.keys(targetCells || {}), ...Object.keys(dg.draftCells || {})]);
          mergedDates.forEach((ds) => {
            changedDates.push(ds);
          });

          if (dg.cellKind === cellKindActual) pln.actualCells = dg.draftCells;
          else pln.cells = dg.draftCells;
          const committedCells = getCellsByKind(pln, dg.cellKind);
          applyPlanCellsDomDiff(pln, dg.orig, committedCells, dg.frozenDates || [], dg.cellDomCache, dg.cellKind);
          updateStartDate();
          recomputeAllPhaseFromCells(pln);
          pln.plannedEnd = computePlannedEnd(pln, state);
          markDirty(state, true);
          syncLeftPanePlanSummaryDom(pln.id, pln.isPlanOrActual);
          refreshManhoursRowsDom(changedDates, dg.cellKind === cellKindActual);
          if (dg.cellKind === cellKindPlan && shouldRefreshGanttNearRangeEdge(pln, dg.frozenDates || dates || [], pln.cells)) renderGantt();
        }
      }
      state.drag = null;
    };
    window.addEventListener("pointermove", onMove);
    window.addEventListener("pointerup", onUp);
  }

  function onCellPointerMove(e, pl) {
    const dg = state.drag;
    if (!dg || !pl || dg.planId !== pl.id) return;
    const dates = dg.frozenDates && dg.frozenDates.length ? dg.frozenDates : getDateRange(state);
    const dayW = 28;
    const dx = e.clientX - dg.startX;
    const step = Math.round(dx / dayW);
    if (step === dg.lastStep) return;

    const { startIdx, endIdx } = dg.block || {};
    if (startIdx == null || endIdx == null) return;

    const prevDraft = dg.draftCells || cloneCells(dg.orig || {});
    const nextCells = cloneCells(dg.orig || {});
    let changed = false;

    if (dg.mode === MOUSE_EV_MODE_MOVE) {
      const targets = [];
      for (let di = startIdx; di <= endIdx; di++) {
        const k = dates[di];
        if (!dg.orig[k]) continue;
        const ti = shiftIndexByBusinessDays(dates, di, step, pl, state);
        if (ti < 0) return;
        targets.push({ src: di, dst: ti });
      }
      for (let di = startIdx; di <= endIdx; di++) {
        const k = dates[di];
        if (dg.orig[k]) {
          if (nextCells[k].util) {
            delete nextCells[k].util;
          }
          if (Object.keys(nextCells[k]).length === 0) {
            delete nextCells[k];
          }
        }
      }
      for (let i = 0; i < targets.length; i++) {
        const srcKey = dates[targets[i].src];
        const dstKey = dates[targets[i].dst];
        const cell = dg.orig[srcKey];
        if (!cell) continue;
        //nextCells[dstKey] = JSON.parse(JSON.stringify(cell));
        if (!cell.util || typeof cell.util !== "object" || cell.util === true) {
          delete nextCells[dstKey].util;
          if (Object.keys(nextCells[dstKey]).length === 0) {
            delete nextCells[dstKey];
          }
        } else {
          if (!cell.util.value) {
            if (!nextCells[dstKey] || typeof nextCells[dstKey] !== "object" || nextCells[dstKey] === true) nextCells[dstKey] = { util: {} };
            else nextCells[dstKey].util = {};
          } else {
            if (!nextCells[dstKey] || typeof nextCells[dstKey] !== "object" || nextCells[dstKey] === true) nextCells[dstKey] = { util: { value: cell.util.value } };
            else nextCells[dstKey].util = { value: cell.util.value };
          }
        }
      }
      changed = step !== 0;
    } else if (dg.mode === MOUSE_EV_MODE_RESIZE_LEFT) {
      const si = startIdx;
      const ei = endIdx;
      if (step > 0) {
        const nextSi = shiftIndexByBusinessDays(dates, si, step, pl, state);
        if (nextSi < 0) return;
        for (let di = si; di < nextSi && di <= ei; di++) {
          clearInputCell(nextCells, dates[di]);
        }
      } else if (step < 0) {
        let addIdx = si;
        let need = -step;
        while (need > 0) {
          addIdx--;
          if (addIdx < 0) return;
          if (isHolidayDate(dates[addIdx], pl, state)) continue;
          const util0 = pl.utilization == null ? 1 : Number(pl.utilization);

          let nextCell = nextCells[dates[addIdx]];
          if (!nextCell || typeof nextCell !== "object" || nextCell === true) nextCell = {};
          nextCell.util = {};
          if (dg.startHasUtil) nextCell.util.value = dg.startUtil;
          nextCells[dates[addIdx]] = nextCell;

          need--;
        }
      }
      changed = step !== 0;
    } else if (dg.mode === MOUSE_EV_MODE_RESIZE_RIGHT) {
      const si = startIdx;
      const ei = endIdx;
      if (step < 0) {
        const nextEi = shiftIndexByBusinessDays(dates, ei, step, pl, state);
        if (nextEi < 0) return;
        for (let di = ei; di > nextEi && di >= si; di--) {
          clearInputCell(nextCells, dates[di]);
        }
      } else if (step > 0) {
        let addIdx = ei;
        let need = step;
        while (need > 0) {
          addIdx++;
          if (addIdx >= dates.length) return;
          if (isHolidayDate(dates[addIdx], pl, state)) continue;
          const util0 = pl.utilization == null ? 1 : Number(pl.utilization);

          let nextCell = nextCells[dates[addIdx]];
          if (!nextCell || typeof nextCell !== "object" || nextCell === true) nextCell = {};
          nextCell.util = {};
          if (dg.startHasUtil) nextCell.util.value = dg.startUtil;
          nextCells[dates[addIdx]] = nextCell;
          
          need--;
        }
      }
      changed = step !== 0;
    } else {
      return;
    }

    const touched = applyPlanCellsDomDiff(pl, prevDraft, nextCells, dates, dg.cellDomCache, dg.cellKind);
    dg.touchedDates = touched;
    dg.draftCells = nextCells;
    dg.lastStep = step;
    dg.changed = changed;
  }

  async function saveData() {
    // file:// で開いた場合、ブラウザによっては File System Access API が制限されることがある
    // htmlファイル名からjsファイル名を生成する場合
    // const htmlFileName = location.pathname.split('/').pop() || "gantt.html";
    // const nameWithoutExt = htmlFileName.substring(0, htmlFileName.lastIndexOf('.')) || htmlFileName;
    // const dataFileName = nameWithoutExt + '.js';

    // domからsrc="gantt(<variable>).js"が指定されているscriptタグを検索してsrc属性の値を取得する
    const ganttScriptTag = document.querySelector('script[src*="gantt"]');
    const dataFileNameEnc = ganttScriptTag.src?.split('/').pop() || "gantt.js";
    // パーセントエンコーディングをデコード
    const dataFileName = decodeURIComponent(dataFileNameEnc);

    const text = serializeJs(cloneForSave(state.data));
    try {
      if (isWri() && wri && wri.io && wri.io.file && wri.io.file.SaveTo) {
        const htmlPath = wri.SourceDirectoryPath;
        const filePath = wri.io.path.Combine(htmlPath, dataFileName);
        wri.io.file.SaveTo(filePath, text);
      } else if (window.showSaveFilePicker) {
        const handle = state.fileHandle || await window.showSaveFilePicker({
          suggestedName: dataFileName,
          types: [{ description: "JS", accept: { "application/javascript": [".js"] } }],
        });
        const w = await handle.createWritable();
        await w.write(text);
        await w.close();
        state.fileHandle = handle;
      } else {
        alert("この環境では File System Access API が使えません。");
        return;
      }
      markDirty(state, false);
      alert("保存しました。");
      renderTop();
    } catch (err) {
      console.error(err);
      alert("保存に失敗しました: " + (err && err.message ? err.message : String(err)));
    }
  }

  function saveViewer() {
    try {
      // htmlファイル名からjsファイル名を生成する場合
      const htmlFileName = location.pathname.split('/').pop() || "gantt.html";
      const nameWithoutExt = htmlFileName.substring(0, htmlFileName.lastIndexOf('.')) || htmlFileName;
      const dataFileName = decodeURIComponent(nameWithoutExt) + "_viewer.html";

      // 現在のHTMLファイルの内容をテキストとして取得
      topPane.innerHTML = "";
      leftPane.innerHTML = "";
      ganttVScroll.innerHTML = "";
      let htmlText = document.documentElement.outerHTML;
      
      // gantt.jsを参照するscriptタグを削除（正規表現を使用）
      htmlText = htmlText.replace(/<script[^>]*src[^>]*gantt(?:_.+)?\.js[^>]*><\/script>/gi, "");
      
      // データをJSON化
      const jsonData = JSON.stringify(state.data, null, 2);
      
      // 埋め込むスクリプトコード（エスケープなし）
      const dataScript = "window.__GANTT_DATA__ = " + jsonData + ";\nwindow.__GANTT_VIEWER_MODE__ = true;";
      
      // window.__GANTT_DATA__ 初期化スクリプトの直後に新しいスクリプトを挿入
      const initScriptPattern = /window\.__GANTT_DATA__ = null;/;
      
      if (initScriptPattern.test(htmlText)) {
        // 初期化スクリプトが見つかった場合、その直後に挿入
        htmlText = htmlText.replace(
          initScriptPattern,
          (match) => dataScript + "\n"
        );
      } else {
        // 見つからない場合は警告を表示して終了
        alert("初期化スクリプトが見つかりませんでした。データは埋め込まれません。");
        return;
      }

      const initViewModePattern = /window\.__GANTT_VIEWER_MODE__ = false;/;
      if (initViewModePattern.test(htmlText)) {
        // 初期化が見つかった場合削除
        htmlText = htmlText.replace(
          initViewModePattern,
          (match) => ""
        );
      }

      // fix
      htmlText = "<!DOCTYPE html>\n" + htmlText;
      
      // HTMLをBlob化
      const blob = new Blob([htmlText], { type: "text/html; charset=utf-8" });
      const url = URL.createObjectURL(blob);
      
      // ダウンロードリンクを作成
      const link = document.createElement("a");
      link.href = url;
      link.download = dataFileName;
      
      // ダウンロード実行
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      
      // リソース解放
      setTimeout(() => URL.revokeObjectURL(url), 100);
      
      alert("Viewer保存完了: " + dataFileName);

      renderAll();
    } catch (err) {
      console.error(err);
      alert("Viewer保存に失敗しました: " + (err && err.message ? err.message : String(err)));
    }
  }

  function saveNamedData() {
    const name = prompt("ガントチャートツール名を入力してください:", "");
    if (!name || !name.trim()) return;
    
    // const safeName = name.trim().replace(/[^a-zA-Z0-9_-]/g, "_");
    const safeName = name.trim();
    const htmlFileName = "gantt_" + safeName + ".html";
    const dataFileName = "gantt_" + safeName + ".js";
    
    try {
      // 1. データファイルを保存
      const jsText = serializeJs(cloneForSave(state.data));
      const jsBlob = new Blob([jsText], { type: "application/javascript; charset=utf-8" });
      const jsUrl = URL.createObjectURL(jsBlob);
      
      const jsLink = document.createElement("a");
      jsLink.href = jsUrl;
      jsLink.download = dataFileName;
      document.body.appendChild(jsLink);
      jsLink.click();
      document.body.removeChild(jsLink);
      
      setTimeout(() => URL.revokeObjectURL(jsUrl), 100);
      
      // 2. HTMLファイルを保存（修正後）
      topPane.innerHTML = "";
      leftPane.innerHTML = "";
      ganttVScroll.innerHTML = "";
      let htmlText = document.documentElement.outerHTML;
      
      // gantt.jsの参照を gantt_xxx.js に変更
      htmlText = htmlText.replace(
        /src="gantt(?:_.+)?\.js"/g,
        'src="' + dataFileName + '"'
      );
      
      // fix
      htmlText = "<!DOCTYPE html>\n" + htmlText;
      
      const htmlBlob = new Blob([htmlText], { type: "text/html; charset=utf-8" });
      const htmlUrl = URL.createObjectURL(htmlBlob);
      
      const htmlLink = document.createElement("a");
      htmlLink.href = htmlUrl;
      htmlLink.download = htmlFileName;
      document.body.appendChild(htmlLink);
      htmlLink.click();
      document.body.removeChild(htmlLink);
      
      setTimeout(() => URL.revokeObjectURL(htmlUrl), 100);
      
      alert("名前付き保存完了:\n" + htmlFileName + "\n" + dataFileName);
      renderAll();
    } catch (err) {
      console.error(err);
      alert("名前付き保存に失敗しました: " + (err && err.message ? err.message : String(err)));
    }
  }

  function renderAll() {
    ensurePhaseKeys(state);
    eachPlan(state, (pl) => {
      recomputeAllPhaseFromCells(pl);
      pl.plannedEnd = computePlannedEnd(pl, state);
    });
    document.documentElement.style.setProperty("--leftW", state.leftPaneWidth + "px");
    if (state.topPaneHeight == null) {
      document.documentElement.style.setProperty("--topH", "auto");
    } else {
      const appRect = appRoot.getBoundingClientRect();
      const minTop = 80;
      const maxTop = Math.max(minTop, appRect.height * 0.7);
      state.topPaneHeight = Math.min(Math.max(state.topPaneHeight, minTop), maxTop);
      document.documentElement.style.setProperty("--topH", state.topPaneHeight + "px");
    }
    topPane.classList.toggle("hidden", !state.topPaneVisible);
    hResizer.classList.toggle("hidden", !state.topPaneVisible);
    leftPane.classList.toggle("hidden", !state.inputPaneVisible);
    resizer.classList.toggle("hidden", !state.inputPaneVisible);
    renderTop();
    renderInputPane();
    renderGantt();
  }

  let resizingX = false;
  let resizingY = false;
  resizer.addEventListener("mousedown", (e) => {
    resizingX = true;
    e.preventDefault();
  });
  hResizer.addEventListener("mousedown", (e) => {
    resizingY = true;
    e.preventDefault();
  });
  window.addEventListener("mousemove", (e) => {
    if (resizingX) {
      const r = bottomPane.getBoundingClientRect();
      state.leftPaneWidth = Math.min(Math.max(e.clientX - r.left, 200), r.width * 0.7);
      document.documentElement.style.setProperty("--leftW", state.leftPaneWidth + "px");
    }
    if (resizingY) {
      const r = appRoot.getBoundingClientRect();
      const minTop = 40;
      const maxTop = Math.max(minTop, r.height * 0.7);
      state.topPaneHeight = Math.min(Math.max(e.clientY - r.top, minTop), maxTop);
      document.documentElement.style.setProperty("--topH", state.topPaneHeight + "px");
    }
  });
  window.addEventListener("mouseup", () => {
    resizingX = false;
    resizingY = false;
  });
  window.addEventListener("resize", () => {
    if (state.topPaneHeight == null) return;
    const r = appRoot.getBoundingClientRect();
    const minTop = 80;
    const maxTop = Math.max(minTop, r.height * 0.7);
    state.topPaneHeight = Math.min(Math.max(state.topPaneHeight, minTop), maxTop);
    document.documentElement.style.setProperty("--topH", state.topPaneHeight + "px");
  });

  window.addEventListener("beforeunload", (e) => {
    if (state.dirty) {
      e.preventDefault();
      e.returnValue = "";
    }
  });
  window.addEventListener("keydown", (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "s") {
      e.preventDefault();
      saveData();
    }
  });

  initData();
  renderAll();
})();
  </script>
</body>
</html>
